name: payment-ci

on:
  push:
    branches: [master]
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-ci.yml"
      - ".github/workflows/_build-service.yml"
  pull_request:
    paths:
      - "payment-service/**"
      - ".github/workflows/payment-ci.yml"
      - ".github/workflows/_build-service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/_build-service.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      service: payment