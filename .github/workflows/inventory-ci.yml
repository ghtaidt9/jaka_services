name: inventory-ci

on:
  push:
    branches: [master]
    paths:
      - "inventory-service/**"
      - ".github/workflows/inventory-ci.yml"
      - ".github/workflows/_build-service.yml"
  pull_request:
    paths:
      - "inventory-service/**"
      - ".github/workflows/inventory-ci.yml"
      - ".github/workflows/_build-service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/_build-service.yml
    permissions:
      contents: read
      id-token: write
    with:
      service: inventory
  deploy-dev:
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy-dev.yml
    permissions:
      contents: read
      id-token: write
    with:
      services: '["inventory"]'
      tag: sha-${{ github.sha }}
