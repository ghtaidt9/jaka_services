# LocalStack for jaka_modularized. Same container name/port as
# ../jaka_aws_networking/localstack, so run only one of the two at a time.
#   docker compose up -d        (from this folder)
# ALB, ASG, RDS, ElastiCache and ECR need LocalStack Pro: put
# LOCALSTACK_AUTH_TOKEN=... in a .env file next to this one.
services:
  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack-pro:latest}
    container_name: localstack
    ports:
      - "127.0.0.1:4566:4566"            # edge endpoint (all AWS APIs)
      - "127.0.0.1:4510-4559:4510-4559"  # external service ports (RDS, ElastiCache, ...)
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - DEBUG=0
      - PERSISTENCE=1
      - EC2_VM_MANAGER=docker
    volumes:
      - "./volume:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
